<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>집밥 레시피 노트</title>
<meta name="description" content="직접 잡은 한치·벤자리·오징어로 만든 집밥 레시피 모음">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="favicon-180.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    --paper:#eef0e4; --paper-2:#e3e6d6; --card:#fbfaf3; --line:#c9d0bd;
    --ink:#263029; --ink-dim:#5c6b5e;
    --chili:#b23b2a; --chili-dim:#923022; --sea:#3f7a73;
    --shadow:0 18px 44px -20px rgba(38,48,41,.35);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1a211c; --paper-2:#202820; --card:#222b23; --line:#34402f;
      --ink:#e9ecd9; --ink-dim:#9db098;
      --chili:#e06249; --chili-dim:#c94d33; --sea:#6fc2b6;
      --shadow:0 18px 44px -20px rgba(0,0,0,.6);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1a211c; --paper-2:#202820; --card:#222b23; --line:#34402f;
    --ink:#e9ecd9; --ink-dim:#9db098;
    --chili:#e06249; --chili-dim:#c94d33; --sea:#6fc2b6;
    --shadow:0 18px 44px -20px rgba(0,0,0,.6);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .disp{font-family:'Gaegu',cursive;}
  .num{font-family:'IBM Plex Mono',monospace; font-variant-numeric:tabular-nums;}
  h1,h2,h3{text-wrap:balance;}

  .wrap{max-width:980px; margin:0 auto; padding:34px 20px 90px;}

  .masthead{margin-bottom:26px;}
  .masthead .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--sea); font-weight:500;
  }
  .masthead h1{font-size:40px; margin:4px 0 6px; font-weight:700;}
  .masthead .sub{color:var(--ink-dim); font-size:15px; line-height:1.6; max-width:52ch;}

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:18px; margin-top:28px;
  }
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    overflow:hidden; cursor:pointer; text-align:left; padding:0; color:inherit;
    font:inherit; display:flex; flex-direction:column; box-shadow:var(--shadow);
    transition:transform .15s ease;
  }
  .card:hover{transform:translateY(-3px);}
  .card:focus-visible{outline:2px solid var(--chili); outline-offset:2px;}
  .card .photo{width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--paper-2);}
  .card .body{padding:14px 15px 16px; display:flex; flex-direction:column; gap:6px; flex:1;}
  .card .top{display:flex; align-items:baseline; justify-content:space-between; gap:8px;}
  .card .name{font-family:'Gaegu',cursive; font-size:21px; font-weight:700;}
  .card .cat{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--sea); background:color-mix(in srgb, var(--sea) 14%, transparent); border-radius:20px; padding:2px 9px; white-space:nowrap;}
  .card .teaser{font-size:12.5px; color:var(--ink-dim); line-height:1.5;}
  .card .meta{margin-top:auto; padding-top:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-dim); display:flex; justify-content:space-between; border-top:1px dashed var(--line);}
  .card .caught{color:var(--chili);}

  .scrim{position:fixed; inset:0; background:rgba(20,24,18,.55); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:40;}
  .scrim.open{opacity:1; pointer-events:auto;}

  .panel{position:fixed; z-index:41; background:var(--card); box-shadow:var(--shadow); overflow-y:auto; right:0; top:0; bottom:0; width:min(520px,100%); transform:translateX(100%); transition:transform .26s cubic-bezier(.3,.8,.4,1); border-left:1px solid var(--line);}
  .panel.open{transform:translateX(0);}
  @media (max-width:640px){
    .panel{right:0; left:0; top:auto; width:auto; max-height:90vh; border-radius:18px 18px 0 0; border-left:none; border-top:1px solid var(--line); transform:translateY(100%);}
    .panel.open{transform:translateY(0);}
  }

  .panel-photo{width:100%; aspect-ratio:16/10; object-fit:cover; display:block;}
  .panel-head{position:sticky; top:0; background:var(--card); padding:16px 22px 12px; display:flex; justify-content:space-between; align-items:flex-start; gap:10px; border-bottom:1px solid var(--line);}
  .panel-head h2{font-family:'Gaegu',cursive; font-size:28px; font-weight:700; margin:0;}
  .panel-head .pd-cat{font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--sea); letter-spacing:.05em; margin-top:2px;}
  .panel-close{background:var(--paper-2); border:1px solid var(--line); color:var(--ink); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:15px; flex:none; display:flex; align-items:center; justify-content:center;}
  .panel-close:hover{background:var(--line);}

  .panel-body{padding:18px 22px 30px;}
  .meta-row{display:flex; gap:14px; flex-wrap:wrap; font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-dim); margin-bottom:16px;}
  .meta-row span b{color:var(--ink); font-weight:600;}

  .caught-badge{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; color:var(--chili); background:color-mix(in srgb, var(--chili) 13%, transparent); border:1px solid color-mix(in srgb, var(--chili) 35%, transparent); border-radius:8px; padding:6px 10px; margin-bottom:18px;}

  .sec{margin-bottom:20px;}
  .sec h3{font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-dim); margin:0 0 9px; font-weight:600;}
  .ingredients{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:5px;}
  .ingredients li{font-size:14px; display:flex; justify-content:space-between; gap:10px; border-bottom:1px dotted var(--line); padding-bottom:5px;}
  .ingredients li .qty{font-family:'IBM Plex Mono',monospace; font-size:12.5px; color:var(--ink-dim); white-space:nowrap;}

  .steps{list-style:none; margin:0; padding:0; counter-reset:step; display:flex; flex-direction:column; gap:12px;}
  .steps li{display:flex; gap:12px; font-size:14.5px; line-height:1.6;}
  .steps li::before{counter-increment:step; content:counter(step); font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; color:var(--card); background:var(--sea); width:22px; height:22px; border-radius:50%; flex:none; display:flex; align-items:center; justify-content:center; margin-top:1px;}

  .tip-note{font-size:13px; color:var(--chili-dim); background:color-mix(in srgb, var(--chili) 10%, transparent); border:1px solid color-mix(in srgb, var(--chili) 28%, transparent); border-radius:8px; padding:9px 11px; margin-top:10px; line-height:1.55;}
  .verdict{font-family:'Gaegu',cursive; font-size:17px; color:var(--sea); margin-top:4px;}
  .video-link{display:inline-flex; align-items:center; gap:6px; font-size:13.5px; color:var(--sea); text-decoration:none; border:1px solid var(--line); border-radius:8px; padding:8px 11px;}
  .video-link:hover{border-color:var(--sea); background:color-mix(in srgb, var(--sea) 10%, transparent);}

  footer.foot{max-width:980px; margin:36px auto 0; padding:0 20px; color:var(--ink-dim); font-size:11.5px; font-family:'IBM Plex Mono',monospace;}
  footer.foot a{color:var(--sea);}

  /* 헤더 버튼 */
  .masthead-top{display:flex; justify-content:space-between; align-items:center;}
  .btn-write{background:var(--chili); color:#fff; border:none; border-radius:24px; padding:7px 15px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px; box-shadow:0 4px 12px rgba(178,59,42,.25); transition:transform .15s ease, background .15s ease;}
  .btn-write:hover{background:var(--chili-dim); transform:translateY(-1px);}

  /* 모달 공통 */
  .modal-scrim{position:fixed; inset:0; background:rgba(20,24,18,.6); backdrop-filter:blur(3px); opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:50;}
  .modal-scrim.open{opacity:1; pointer-events:auto;}
  .modal{position:fixed; z-index:51; background:var(--card); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); opacity:0; pointer-events:none; transition:all .22s cubic-bezier(.3,.8,.4,1);}
  .modal.open{opacity:1; pointer-events:auto;}

  /* PIN 모달 */
  .modal-pin{top:50%; left:50%; transform:translate(-50%, -50%) scale(.95); width:min(320px, 92vw); padding:24px 20px;}
  .modal-pin.open{transform:translate(-50%, -50%) scale(1);}
  .pin-title{text-align:center; font-family:'Gaegu',cursive; font-size:24px; font-weight:700; margin:0 0 6px;}
  .pin-sub{text-align:center; font-size:12.5px; color:var(--ink-dim); margin-bottom:18px;}
  .pin-dots{display:flex; justify-content:center; gap:12px; margin-bottom:22px;}
  .pin-dot{width:16px; height:16px; border-radius:50%; border:2px solid var(--line); transition:all .15s ease;}
  .pin-dot.on{background:var(--chili); border-color:var(--chili);}
  .pin-dot.err{background:var(--chili); animation:shake .3s ease;}
  .keypad{display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; max-width:240px; margin:0 auto;}
  .key-btn{height:50px; font-family:'IBM Plex Mono',monospace; font-size:20px; font-weight:600; color:var(--ink); background:var(--paper-2); border:1px solid var(--line); border-radius:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; user-select:none;}
  .key-btn:active{background:var(--line); transform:scale(.96);}
  .key-btn.del{font-size:16px; color:var(--ink-dim);}

  /* 레시피 작성 폼 모달 */
  .modal-write{top:4vh; bottom:4vh; left:50%; transform:translateX(-50%) scale(.95); width:min(580px, 94vw); display:flex; flex-direction:column; overflow:hidden;}
  .modal-write.open{transform:translateX(-50%) scale(1);}
  .modal-write-head{padding:14px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; align-items:center; background:var(--card); flex:none;}
  .modal-write-head h2{font-family:'Gaegu',cursive; font-size:24px; font-weight:700; margin:0;}
  .modal-write-body{padding:18px 20px; overflow-y:auto; flex:1; display:flex; flex-direction:column; gap:14px;}
  .modal-write-foot{padding:12px 20px; border-top:1px solid var(--line); display:flex; justify-content:flex-end; gap:10px; background:var(--card); flex:none;}

  /* 폼 요소 */
  .form-group{display:flex; flex-direction:column; gap:5px;}
  .form-group label{font-size:12px; font-weight:600; color:var(--ink-dim);}
  .form-input, .form-textarea{width:100%; font:inherit; font-size:13.5px; padding:9px 11px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); box-sizing:border-box;}
  .form-input:focus, .form-textarea:focus{outline:none; border-color:var(--sea);}
  .form-textarea{resize:vertical; min-height:55px; line-height:1.5;}
  .form-row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .chip-group{display:flex; flex-wrap:wrap; gap:5px; margin-top:2px;}
  .chip{padding:3px 9px; font-size:11.5px; border-radius:14px; border:1px solid var(--line); background:var(--paper-2); color:var(--ink); cursor:pointer; user-select:none; transition:all .15s ease;}
  .chip.selected{background:var(--sea); color:#fff; border-color:var(--sea);}

  /* 다이나믹 리스트 (재료, 순서) */
  .dyn-list{display:flex; flex-direction:column; gap:6px;}
  .dyn-row{display:flex; gap:8px; align-items:center;}
  .dyn-row input{flex:1;}
  .dyn-row input.qty-input{flex:0 0 100px;}
  .dyn-step-row{display:flex; gap:8px; align-items:flex-start;}
  .step-num-badge{width:20px; height:20px; border-radius:50%; background:var(--sea); color:#fff; font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600; display:flex; align-items:center; justify-content:center; flex:none; margin-top:9px;}
  .btn-del{background:none; border:none; color:var(--ink-dim); font-size:16px; cursor:pointer; padding:6px; flex:none;}
  .btn-del:hover{color:var(--chili);}
  .btn-add-row{background:none; border:1px dashed var(--line); border-radius:8px; color:var(--sea); font-size:12px; font-weight:600; padding:6px; cursor:pointer; width:100%; text-align:center; margin-top:2px;}
  .btn-add-row:hover{background:var(--paper-2); border-color:var(--sea);}

  /* 사진 미리보기 박스 */
  .photo-preview{width:100%; aspect-ratio:16/9; border-radius:8px; border:1px dashed var(--line); background:var(--paper-2); overflow:hidden; display:flex; align-items:center; justify-content:center; color:var(--ink-dim); font-size:12.5px; position:relative; cursor:pointer;}
  .photo-preview img{width:100%; height:100%; object-fit:cover; display:none;}
  .photo-preview.has-img img{display:block;}
  .photo-preview.has-img span{display:none;}

  /* 버튼들 */
  .btn-cancel{background:var(--paper-2); border:1px solid var(--line); color:var(--ink); border-radius:8px; padding:8px 14px; font-size:13px; font-weight:500; cursor:pointer;}
  .btn-submit{background:var(--chili); border:none; color:#fff; border-radius:8px; padding:8px 18px; font-size:13px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;}
  .btn-submit:disabled{opacity:.6; cursor:not-allowed;}

  /* 토스트 */
  .toast{position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(30px); background:rgba(38,48,41,.92); color:#fff; font-size:13px; padding:10px 18px; border-radius:24px; opacity:0; pointer-events:none; transition:all .22s ease; z-index:60; box-shadow:0 8px 20px rgba(0,0,0,.3); white-space:nowrap;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="masthead">
    <div class="masthead-top">
      <div class="eyebrow">Hojak Kitchen Notes</div>
      <button class="btn-write" id="btnOpenWrite">✏️ 레시피 등록</button>
    </div>
    <h1 class="disp">집밥 레시피 노트</h1>
    <div class="sub">직접 바다에서 잡아온 한치·벤자리·오징어로 차린 집밥 기록. 재료, 순서, 터득한 팁까지 그대로.</div>
  </div>

  <div class="grid" id="grid"></div>
</div>

<footer class="foot">HOJAK KITCHEN · 재료 대부분은 직접 출조해서 잡은 것들입니다</footer>

<div class="scrim" id="scrim"></div>
<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle"></div>

<!-- 모달 공통 스크림 -->
<div class="modal-scrim" id="modalScrim"></div>

<!-- 1. PIN 인증 모달 -->
<div class="modal modal-pin" id="pinModal" role="dialog" aria-modal="true">
  <div class="pin-title">PIN 번호 입력</div>
  <div class="pin-sub">레시피를 등록하려면 6자리 PIN을 입력하세요.</div>
  <div class="pin-dots" id="pinDots">
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
    <div class="pin-dot"></div>
  </div>
  <div class="keypad" id="keypad">
    <button class="key-btn" data-k="1">1</button>
    <button class="key-btn" data-k="2">2</button>
    <button class="key-btn" data-k="3">3</button>
    <button class="key-btn" data-k="4">4</button>
    <button class="key-btn" data-k="5">5</button>
    <button class="key-btn" data-k="6">6</button>
    <button class="key-btn" data-k="7">7</button>
    <button class="key-btn" data-k="8">8</button>
    <button class="key-btn" data-k="9">9</button>
    <button class="key-btn del" data-k="close">취소</button>
    <button class="key-btn" data-k="0">0</button>
    <button class="key-btn del" data-k="back">⌫</button>
  </div>
</div>

<!-- 2. 레시피 작성 폼 모달 -->
<div class="modal modal-write" id="writeModal" role="dialog" aria-modal="true">
  <div class="modal-write-head">
    <h2>새 레시피 작성</h2>
    <button class="panel-close" id="btnCloseWrite" aria-label="닫기">✕</button>
  </div>
  <div class="modal-write-body">
    <div class="form-group">
      <label>요리명 *</label>
      <input type="text" class="form-input" id="wfName" placeholder="예: 시원한 참외한치냉국" required>
    </div>

    <div class="form-row-2">
      <div class="form-group">
        <label>분류</label>
        <input type="text" class="form-input" id="wfCat" placeholder="직접입력 또는 선택" value="볶음류">
        <div class="chip-group" id="catChips">
          <span class="chip selected" data-val="볶음류">볶음류</span>
          <span class="chip" data-val="국/탕">국/탕</span>
          <span class="chip" data-val="조림/찜">조림/찜</span>
          <span class="chip" data-val="면류">면류</span>
          <span class="chip" data-val="초무침류">초무침류</span>
          <span class="chip" data-val="회/냉국">회/냉국</span>
        </div>
      </div>
      <div class="form-group">
        <label>조리일자</label>
        <input type="date" class="form-input" id="wfDate">
      </div>
    </div>

    <div class="form-row-2">
      <div class="form-group">
        <label>인원 (인분)</label>
        <input type="number" class="form-input" id="wfPeople" placeholder="예: 2" min="1" max="20" value="2">
      </div>
      <div class="form-group">
        <label>어획물 (직접 낚은 재료)</label>
        <input type="text" class="form-input" id="wfCaught" placeholder="예: 쭈꾸미" value="쭈꾸미">
        <div class="chip-group" id="caughtChips">
          <span class="chip selected" data-val="쭈꾸미">쭈꾸미</span>
          <span class="chip" data-val="갑오징어">갑오징어</span>
          <span class="chip" data-val="한치">한치</span>
          <span class="chip" data-val="벤자리">벤자리</span>
          <span class="chip" data-val="오징어">오징어</span>
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>한줄 요약 (카드 설명)</label>
      <input type="text" class="form-input" id="wfTeaser" placeholder="예: 물에 삶지 않고 쪄서 불맛 살린 쭈꾸미볶음">
    </div>

    <div class="form-group">
      <label>완성 사진</label>
      <input type="file" id="wfPhotoFile" accept="image/*" style="display:none;">
      <div class="photo-preview" id="photoPreview">
        <span>📷 사진을 선택하려면 터치하세요 (또는 아래 유튜브 썸네일 자동 활용)</span>
        <img id="photoPreviewImg" alt="미리보기">
      </div>
    </div>

    <div class="form-group">
      <label>재료 및 양념</label>
      <div class="dyn-list" id="dynIngredients">
        <div class="dyn-row">
          <input type="text" class="form-input" placeholder="재료명 (예: 쭈꾸미)" value="">
          <input type="text" class="form-input qty-input" placeholder="분량 (예: 1kg)" value="">
          <button type="button" class="btn-del">✕</button>
        </div>
      </div>
      <button type="button" class="btn-add-row" id="btnAddIng">+ 재료 추가</button>
    </div>

    <div class="form-group">
      <label>조리 순서</label>
      <div class="dyn-list" id="dynSteps">
        <div class="dyn-step-row">
          <span class="step-num-badge">1</span>
          <textarea class="form-textarea" placeholder="조리 단계 설명을 입력하세요"></textarea>
          <button type="button" class="btn-del">✕</button>
        </div>
      </div>
      <button type="button" class="btn-add-row" id="btnAddStep">+ 순서 추가</button>
    </div>

    <div class="form-group">
      <label>터득한 팁 (선택)</label>

  // PIN 모달 열기/닫기
  function openPinModal(){
    currentPin = '';

    modalScrim.classList.add('open');
    pinModal.classList.add('open');

  function closePinModal(){
    currentPin = '';
    pinModal.classList.remove('open');

      modalScrim.classList.remove('open');
    }
  }

  function updatePinDots(isErr){
    var dots = document.querySelectorAll('#pinDots .pin-dot');
    dots.forEach(function(dot, idx){
      dot.className = 'pin-dot' + (idx < currentPin.length ? ' on' : '') + (isErr ? ' err' : '');
    });
  }

  function checkPin(){
    if(currentPin.length === 6){
      // 1차 클라이언트 검증 후 폼 모달 오픈
      verifiedPin = currentPin;
      closePinModal();
      openWriteModal();
    }
  }

  // 가상 키패드 이벤트
  document.getElementById('keypad').addEventListener('click', function(e){
    var btn = e.target.closest('.key-btn');
    if(!btn) return;
    var k = btn.getAttribute('data-k');
    if(k === 'close'){
      closePinModal();
    } else if(k === 'back'){
      if(currentPin.length > 0){
        currentPin = currentPin.slice(0, -1);
        updatePinDots();
      }
    } else if(k && currentPin.length < 6){
      currentPin += k;
      updatePinDots();
      if(currentPin.length === 6){
        setTimeout(checkPin, 100);
      }
    }
  });

  // 키보드 숫자 입력 대응
  document.addEventListener('keydown', function(e){
    if(!pinModal.classList.contains('open')) return;
    if(e.key >= '0' && e.key <= '9'){
      if(currentPin.length < 6){
        currentPin += e.key;
        updatePinDots();
        if(currentPin.length === 6) setTimeout(checkPin, 100);
      }
    } else if(e.key === 'Backspace'){
      if(currentPin.length > 0){
        currentPin = currentPin.slice(0, -1);
        updatePinDots();
      }
    } else if(e.key === 'Escape'){
      closePinModal();
    }
  });

    var container = document.getElementById(containerId);
    var input = document.getElementById(inputId);
    container.addEventListener('click', function(e){
      var chip = e.target.closest('.chip');
      if(!chip) return;
      container.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('selected'); });
      chip.classList.add('selected');
      input.value = chip.getAttribute('data-val');
    });
  }

      uploadedImageBase64 = evt.target.result;
      photoImg.src = uploadedImageBase64;

    var row = document.createElement('div');
    row.className = 'dyn-step-row';
    row.innerHTML = '<span class="step-num-badge"></span>' +
                    '<textarea class="form-textarea" placeholder="조리 단계 설명을 입력하세요"></textarea>' +
                    '<button type="button" class="btn-del">✕</button>';
    dynSteps.appendChild(row);
    renumberSteps();
  });
  dynSteps.addEventListener('click', function(e){
    if(e.target.classList.contains('btn-del')){
      var rows = dynSteps.querySelectorAll('.dyn-step-row');
      if(rows.length > 1){
        e.target.closest('.dyn-step-row').remove();
        renumberSteps();
      } else {
        rows[0].querySelector('textarea').value = '';
      }
    }
  });

  // 레시피 등록 및 N100 API 전송
  document.getElementById('btnSubmitRecipe').addEventListener('click', function(){
    var name = document.getElementById('wfName').value.trim();
    if(!name){
      alert('요리명을 입력해주세요.');
      document.getElementById('wfName').focus();
      return;
    }

    var ingredients = [];
    dynIngredients.querySelectorAll('.dyn-row').forEach(function(row){
      var inputs = row.querySelectorAll('input');
      var n = inputs[0].value.trim();
      var q = inputs[1].value.trim();
      if(n) ingredients.push({ n: n, q: q || '-' });
    });

    var steps = [];
    dynSteps.querySelectorAll('.dyn-step-row textarea').forEach(function(ta){
      var s = ta.value.trim();
      if(s) steps.push(s);
    });

    var payload = {
      pin: verifiedPin,
      name: name,
      cat: document.getElementById('wfCat').value.trim() || '기타',
      date: document.getElementById('wfDate').value || new Date().toISOString().split('T')[0],
      people: parseInt(document.getElementById('wfPeople').value, 10) || null,
      caught: document.getElementById('wfCaught').value.trim() || '직접 어획',
      teaser: document.getElementById('wfTeaser').value.trim() || (name + ' 레시피'),
      ingredients: ingredients,
      steps: steps,
      tip: document.getElementById('wfTip').value.trim() || null,
      verdict: document.getElementById('wfVerdict').value.trim() || null,
      video_url: document.getElementById('wfVideoUrl').value.trim() || null,
      image_base64: uploadedImageBase64
    };

    var btnSubmit = document.getElementById('btnSubmitRecipe');
    btnSubmit.disabled = true;
    btnSubmit.textContent = '저장 및 배포 중... ⏳';

    var apiUrl = getApiUrl();
    fetch(apiUrl, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Recipe-Pin': verifiedPin
      },
      body: JSON.stringify(payload)
    })
    .then(function(res){
      return res.json().then(function(data){ return { status: res.status, data: data }; });
    })
    .then(function(result){
      btnSubmit.disabled = false;
      btnSubmit.textContent = '등록 및 자동 배포';

      if(result.status === 200 && result.data.success){
        showToast('🎉 레시피가 성공적으로 등록 및 배포되었습니다!', 4000);
        closeWriteModal();
        // 프론트엔드 목록 즉시 반영
        if(result.data.recipe){
          recipes.unshift(result.data.recipe);
          renderGrid();
        }
      } else {
        alert('등록 실패 (' + result.status + '): ' + (result.data.message || '알 수 없는 오류'));
      }
    })
    .catch(function(err){
      btnSubmit.disabled = false;
      btnSubmit.textContent = '등록 및 자동 배포';
      alert('서버 통신 실패: Tailscale 연결 상태를 확인해주세요. (' + err.message + ')');
    });
  });

})();
</script>
</body>
</html>
